[package]
name = "appboundkatz"
version = "0.1.0"
edition = "2021"
description = "Educational Rust port of ElevationKatz (ChromeKatz by Meckazin): captures the current user's Chrome/Edge App-Bound Encryption key via a debugger breakpoint and dumps the default profile's saved passwords and cookies to CSV, zipped."
license = "MIT"
publish = false

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Kernel",
    "Win32_UI_WindowsAndMessaging",
] }
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
csv = "1.3"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
